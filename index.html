<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plan" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
  <meta name="description" content="A fast, offline-first month calendar for planning your days." />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Plan</title>
  <script>
    // Set the background before any CSS/JS loads, so there is no white flash.
    (function () {
      try {
        var stored = localStorage.getItem('plan.theme');
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.background = dark ? '#000' : '#fff';
        document.documentElement.setAttribute('data-theme', stored === 'light' || stored === 'dark' ? stored : 'system');
      } catch (e) {}
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    #app { min-height: 100dvh; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
